<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UltraPDF</title>
<style>
:root{--bg:#1c1d20;--bar:#2a2c31;--fg:#eef0f4;--dim:#9aa1ad;--acc:#ff5a4f;--line:#3a3d44;--bh:40px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;overflow:hidden}
/* bars float over the page: showing/hiding them never re-lays-out the document */
.bar{position:absolute;left:0;right:0;z-index:3;height:var(--bh);display:flex;align-items:center;gap:6px;padding:0 6px;
  background:rgba(42,44,49,.96);transition:transform .22s ease,opacity .22s ease;will-change:transform,opacity}
#top{top:0;border-bottom:1px solid var(--line)}
#bot{bottom:0;border-top:1px solid var(--line);display:none;gap:10px;padding:0 12px}
body.hasdoc #bot{display:flex}
body.nobars #top{transform:translateY(-100%);opacity:0;pointer-events:none}
body.nobars #bot{transform:translateY(100%);opacity:0;pointer-events:none}
button{font:inherit;color:var(--fg);background:#3a3d45;border:0;border-radius:10px;padding:9px 14px;min-height:40px}
button:active{background:#4a4e58}
button.acc{background:var(--acc);color:#fff;font-weight:600}
button.ib{width:40px;height:34px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-radius:8px}
button.ib:active{background:#3a3d45}
button.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#menu{position:absolute;left:6px;top:calc(var(--bh) + 4px);z-index:6;min-width:230px;background:#33363d;border:1px solid var(--line);border-radius:12px;
  padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);transform-origin:0 0;transform:scale(.92);opacity:0;pointer-events:none;transition:transform .14s ease,opacity .14s ease}
body.menu #menu{transform:none;opacity:1;pointer-events:auto}
#scrim{position:absolute;left:0;right:0;top:0;bottom:0;z-index:5;display:none}
body.menu #scrim{display:block}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:46px;padding:0 12px;border-radius:8px;background:transparent;text-align:left;font-size:15px}
.mi:active{background:#454953}
.mi svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--dim)}
#about{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#about.on{display:flex}
#about .card{width:min(86vw,340px);background:#2f3238;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
#about .ttl{font-size:22px;font-weight:700}
#about .ver{color:var(--dim);font-size:14px;margin-bottom:6px}
#about button{width:100%}
body:not(.hasdoc) .needdoc{opacity:.4;pointer-events:none}
#sbar{top:0;z-index:4;transform:translateY(-100%);opacity:0;pointer-events:none;background:var(--bar)}
body.searching #sbar{transform:none;opacity:1;pointer-events:auto}
body.searching #top{opacity:0;pointer-events:none}
#sq{flex:1;min-width:0;height:32px;font:inherit;color:var(--fg);background:#16171a;border:1px solid var(--line);border-radius:8px;padding:0 10px;-webkit-user-select:text;user-select:text}
#scount{min-width:52px;text-align:center;color:var(--dim);font-size:13px;white-space:nowrap}
.hl{position:absolute;background:rgba(255,214,0,.38);border-radius:2px;pointer-events:none;mix-blend-mode:multiply}
body.night .hl{background:rgba(255,214,0,.45);mix-blend-mode:screen}
.hl.cur{background:rgba(255,120,0,.55)}
body.night .hl.cur{background:rgba(255,140,0,.6)}
#sun{display:none}
body.night #sun{display:block}
body.night #moon{display:none}
#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim);font-size:14px}
#scroller{position:absolute;left:0;right:0;top:0;bottom:0;overflow:auto;background:#111;touch-action:pan-x pan-y;display:none;overscroll-behavior:contain}
body.hasdoc #scroller{display:block}
#scroller::-webkit-scrollbar{display:none}
#pages{position:relative;width:100%;padding-top:var(--bh);padding-bottom:var(--bh)}
.pg{position:relative;width:100%;height:0;background:#fff;margin:0 0 1.2%;contain:layout paint style}
.pg img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.pg .ph{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:20px}
.pg.on .ph{display:none}
body.night .pg{background:#000}
#empty{position:absolute;left:0;right:0;top:var(--bh);bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
body.hasdoc #empty{display:none}
#empty .big{font-size:26px;font-weight:700;letter-spacing:.3px}
#empty .msg{color:var(--dim);max-width:30em}
#empty .err{color:#ff8a80}
#slider{flex:1;min-width:0;accent-color:var(--acc);height:28px;margin:0}
#lbl{min-width:70px;text-align:center;background:#3a3d45;border-radius:8px;padding:5px 8px;font-size:14px;font-variant-numeric:tabular-nums}
#jump{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;padding:12px;background:var(--bar);border-top:1px solid var(--line);z-index:5}
#jump.on{display:flex}
#jump input{flex:1;min-width:0;font:inherit;color:var(--fg);background:#16171a;border:1px solid var(--line);border-radius:10px;padding:9px 12px;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="top">
    <button class="ib" id="burger" title="Меню" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div id="title"></div>
  </div>
  <div class="bar" id="sbar">
    <button class="ib" id="sclose" title="Закрыть поиск" aria-label="Закрыть поиск"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <input id="sq" type="search" placeholder="Поиск в документе" autocomplete="off" enterkeyhint="search">
    <div id="scount"></div>
    <button class="ib" id="sprev" title="Назад" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="ib" id="snext" title="Дальше" aria-label="Дальше"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div id="scrim"></div>
  <div id="menu">
    <button class="mi" id="m-open"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Открыть</button>
    <button class="mi" id="night"><svg id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="nlbl">Ночной режим</span></button>
    <button class="mi needdoc" id="m-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>Поиск</button>
    <button class="mi needdoc" id="m-share"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>Поделиться</button>
    <button class="mi needdoc" id="m-save"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Сохранить как…</button>
    <button class="mi" id="m-about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.2"/></svg>О приложении</button>
  </div>
  <div id="about">
    <div class="card">
      <div class="ttl">UltraPDF</div>
      <div class="ver" id="aver"></div>
      <button class="acc" id="a-upd">Проверить обновления</button>
      <button id="a-share">Поделиться приложением</button>
      <button id="a-git">GitHub</button>
      <button id="a-close">Закрыть</button>
    </div>
  </div>
  <div id="empty">
    <div class="big">UltraPDF</div>
    <div class="msg" id="emsg">Открой PDF-файл из памяти телефона. Файл никуда не отправляется.</div>
    <button class="acc" id="open2">Выбрать PDF</button>
  </div>
  <div id="scroller"><div id="pages"></div></div>
  <div class="bar" id="bot">
    <input type="range" id="slider" min="1" max="1" value="1">
    <div id="lbl">1 / 1</div>
  </div>
</div>
<div id="jump">
  <input type="number" id="jin" inputmode="numeric" min="1" placeholder="Номер страницы">
  <button class="acc" id="jgo">Перейти</button>
  <button id="jx">Отмена</button>
</div>
<script>
(function () {
  'use strict';
  var A = window.Android;
  var $ = function (id) { return document.getElementById(id); };
  var sc = $('scroller'), pagesEl = $('pages'), titleEl = $('title'), emsg = $('emsg'),
      slider = $('slider'), lbl = $('lbl'), jump = $('jump'), jin = $('jin');
  var DEF_MSG = emsg.textContent;
  var gen = 0, N = 0, name = '', els = [], imgs = {}, z = 1, cur = 0, sized = false, myDoc = 0;
  var dpr = window.devicePixelRatio || 1;
  var BH = 40;   // height of the floating bars, keep in sync with --bh in the CSS

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- night mode ---------- */
  var night = lsGet('night') === '1';
  function applyNight() {
    document.body.classList.toggle('night', night);
    $('nlbl').textContent = night ? 'Дневной режим' : 'Ночной режим';
  }
  // pages are inverted natively (Java side), so a switch just asks for fresh renders
  $('night').addEventListener('click', function () { closeMenu(); night = !night; lsSet('night', night ? '1' : '0'); applyNight(); schedule(); });
  applyNight();

  /* ---------- opening files ---------- */
  function pick() { try { A.pick(); } catch (e) { showEmpty('Не удалось открыть выбор файла.', true); } }
  $('open2').addEventListener('click', pick);

  /* ---------- hamburger menu ---------- */
  var body = document.body;
  function closeMenu() { body.classList.remove('menu'); }
  $('burger').addEventListener('click', function () { body.classList.toggle('menu'); });
  $('scrim').addEventListener('click', closeMenu);
  $('m-open').addEventListener('click', function () { closeMenu(); pick(); });
  $('m-share').addEventListener('click', function () { closeMenu(); try { A.share(); } catch (e) {} });
  $('m-save').addEventListener('click', function () { closeMenu(); try { A.saveAs(); } catch (e) {} });
  $('m-search').addEventListener('click', function () { closeMenu(); openSearch(); });

  /* ---------- about ---------- */
  var aboutEl = $('about');
  $('m-about').addEventListener('click', function () {
    closeMenu();
    var v = '';
    try { v = 'Версия ' + A.version(); } catch (e) {}
    $('aver').textContent = v;
    aboutEl.classList.add('on');
  });
  $('a-close').addEventListener('click', function () { aboutEl.classList.remove('on'); });
  aboutEl.addEventListener('click', function (e) { if (e.target === aboutEl) aboutEl.classList.remove('on'); });
  $('a-upd').addEventListener('click', function () { aboutEl.classList.remove('on'); try { A.checkUpdate(); } catch (e) {} });
  $('a-share').addEventListener('click', function () { try { A.shareApp(); } catch (e) {} });
  $('a-git').addEventListener('click', function () { try { A.github(); } catch (e) {} });

  function showEmpty(msg, isErr) {
    document.body.classList.remove('hasdoc');
    document.body.classList.remove('nobars');
    emsg.textContent = msg || DEF_MSG;
    emsg.className = 'msg' + (isErr ? ' err' : '');
    titleEl.textContent = '';
  }

  function cleanName(n) {
    n = String(n || '').replace(/^.*[\/:]/, '');
    if (!n || /^\d+$/.test(n)) return 'Документ';
    return n;
  }

  /* ---------- layout helpers ---------- */
  function indexAt(y) {
    var lo = 0, hi = els.length - 1;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (els[mid].offsetTop <= y) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  function targetW() {
    var w = Math.ceil(pagesEl.clientWidth * dpr / 64) * 64;
    return Math.max(640, Math.min(2400, w));
  }
  var pw = [], ph = [];
  function applyDim(i, w, h) {
    if (w > 0 && h > 0) { pw[i] = w; ph[i] = h; els[i].style.paddingBottom = (h / w * 100) + '%'; paintHl(i); }
  }

  function build() {
    pagesEl.innerHTML = '';
    els = []; imgs = {}; cur = 0; sized = false; z = 1; pw = []; ph = [];
    closeSearch(); closeMenu();
    pagesEl.style.width = '100%';
    sc.scrollTop = 0; sc.scrollLeft = 0;
    var w0 = 595, h0 = 842;
    try { var v0 = String(A.szs(0, 1)).split(';')[0].split(',').map(Number); if (v0[0] > 0 && v0[1] > 0) { w0 = v0[0]; h0 = v0[1]; } } catch (e) {}
    var frag = document.createDocumentFragment();
    for (var i = 0; i < N; i++) {
      var d = document.createElement('div');
      d.className = 'pg';
      var ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = String(i + 1);
      d.appendChild(ph);
      frag.appendChild(d);
      els.push(d);
    }
    pagesEl.appendChild(frag);
    for (i = 0; i < N; i++) applyDim(i, w0, h0);
    slider.max = String(N);
    slider.value = '1';
    updateLabel();
    sizeJob(1, myDoc);
    schedule();
  }

  // page sizes are read in small batches so the UI stays responsive on long documents
  function sizeJob(from, doc) {
    var t0 = Date.now(), i = from;
    while (i < N && Date.now() - t0 < 12) {
      // sizes come in batches: one bridge call per 32 pages instead of one per page
      var got = 0;
      try {
        var parts = String(A.szs(i, 32)).split(';');
        for (var k = 0; k < parts.length && i + k < N; k++) {
          if (!parts[k]) break;            // trailing ';' of the reply
          var wh = parts[k].split(',');
          applyDim(i + k, +wh[0], +wh[1]);
          got++;
        }
      } catch (e) {}
      i += got || 32;
    }
    if (i > N) i = N;
    if (doc !== myDoc) return;
    if (i < N) { setTimeout(function () { sizeJob(i, doc); }, 0); }
    else { sized = true; restore(); schedule(); }
  }

  /* ---------- rendering (lazy, nearest page first) ---------- */
  var timer = 0;
  function schedule() { if (!timer) timer = setTimeout(step, 20); }

  function step() {
    timer = 0;
    if (!N) return;
    var tw = targetW(), h = sc.clientHeight;
    // at most two page requests in flight: stale ones never pile up while scrolling fast
    var busy = 0, nowT = Date.now();
    for (var k in imgs) if (imgs[k].busy && nowT - imgs[k].t < 8000) busy++;
    if (busy >= 2) return;           // an onload/onerror handler calls schedule() again
    var first = indexAt(sc.scrollTop - h), last = indexAt(sc.scrollTop + h * 2);
    var c = indexAt(sc.scrollTop + h * 0.35), best = -1, bd = 1e9;
    for (var i = first; i <= last; i++) {
      var r = imgs[i];
      if (!r || r.q < tw * 0.8 || r.n !== night) {
        var d = Math.abs(i - c);
        if (d < bd) { bd = d; best = i; }
      }
    }
    if (best < 0) { evict(c, tw); return; }
    renderPage(best, tw);
    schedule();
  }

  // pages arrive as plain images from the app (https://pdf.local/..., answered natively off the JS thread)
  function renderPage(i, tw) {
    var r = imgs[i] || (imgs[i] = {});
    r.q = tw; r.n = night;           // even a failed page is not retried in a loop
    var img = r.img;
    if (!img) {
      img = r.img = document.createElement('img');
      img.alt = ''; img.decoding = 'async'; img.draggable = false;
      img.onload = function () {
        if (imgs[i] !== r) return;
        r.busy = false; els[i].classList.add('on'); schedule();
      };
      img.onerror = function () { if (imgs[i] !== r) return; r.busy = false; schedule(); };
      els[i].appendChild(img);
    }
    r.busy = true; r.t = Date.now();
    img.src = 'https://pdf.local/p/' + i + '.jpg?w=' + tw + '&n=' + (night ? 1 : 0) + '&g=' + gen;
  }

  // decoded pages are big: the zoomier the view, the fewer of them are kept
  function evict(c, tw) {
    var keep = Math.max(3, Math.min(10, Math.floor(100e6 / (tw * tw * 5.66))));
    var keys = Object.keys(imgs);
    if (keys.length <= keep + 3) return;
    keys.sort(function (a, b) { return Math.abs(b - c) - Math.abs(a - c); });
    var guard = keep >= 8 ? 3 : 1;
    for (var k = 0; k < keys.length - keep; k++) {
      var i = +keys[k];
      if (Math.abs(i - c) <= guard) break;
      var r = imgs[i];
      if (r.img && r.img.parentNode) { r.img.removeAttribute('src'); r.img.remove(); }
      els[i].classList.remove('on');
      delete imgs[i];
    }
  }

  /* ---------- current page, label, slider ---------- */
  function updateLabel() {
    lbl.textContent = (cur + 1) + ' / ' + N;
    if (!dragging) slider.value = String(cur + 1);
  }
  var raf = 0;
  sc.addEventListener('scroll', function () {
    if (raf) return;
    raf = requestAnimationFrame(function () {
      raf = 0;
      if (!N) return;
      var i = indexAt(sc.scrollTop + sc.clientHeight * 0.35);
      if (i !== cur) { cur = i; updateLabel(); }
      schedule(); saveSoon();
    });
  }, { passive: true });

  // the page top lands just under the top bar when the bars are shown
  function goTo(i, frac) {
    i = Math.max(0, Math.min(N - 1, i));
    var pad = document.body.classList.contains('nobars') ? 4 : BH;
    sc.scrollTop = els[i].offsetTop + (frac ? frac * els[i].offsetHeight : -pad);
  }

  var dragging = false, sraf = 0;
  slider.addEventListener('input', function () {
    dragging = true;
    var v = parseInt(slider.value, 10) || 1;
    lbl.textContent = v + ' / ' + N;
    if (sraf) return;
    sraf = requestAnimationFrame(function () { sraf = 0; goTo((parseInt(slider.value, 10) || 1) - 1); });
  });
  slider.addEventListener('change', function () { dragging = false; goTo((parseInt(slider.value, 10) || 1) - 1); updateLabel(); });

  lbl.addEventListener('click', function () { jin.value = ''; jin.max = String(N); jump.classList.add('on'); jin.focus(); });
  function closeJump() { jump.classList.remove('on'); try { jin.blur(); } catch (e) {} }
  function doJump() {
    var v = parseInt(jin.value, 10);
    closeJump();
    if (v >= 1 && v <= N) goTo(v - 1);
  }
  $('jgo').addEventListener('click', doJump);
  $('jx').addEventListener('click', closeJump);
  jin.addEventListener('keydown', function (e) { if (e.key === 'Enter') doJump(); });

  /* ---------- remembering the reading position ---------- */
  function posKey() { return 'pos:' + name + ':' + N; }
  var saveT = 0;
  function saveSoon() { if (saveT) clearTimeout(saveT); saveT = setTimeout(saveNow, 600); }
  function saveNow() {
    saveT = 0;
    if (!N || !els[cur]) return;
    var h = els[cur].offsetHeight || 1;
    lsSet(posKey(), JSON.stringify({ i: cur, f: Math.max(0, (sc.scrollTop - els[cur].offsetTop) / h) }));
  }
  function restore() {
    if (sc.scrollTop > 5) return;      // the reader has already started scrolling
    var p = null;
    try { p = JSON.parse(lsGet(posKey()) || 'null'); } catch (e) { p = null; }
    if (p && p.i > 0 && p.i < N) { goTo(p.i, p.f || 0); cur = p.i; updateLabel(); }
  }
  document.addEventListener('visibilitychange', saveNow);

  /* ---------- zoom: pinch + double tap ---------- */
  function setZoom(nz, fx, fy) {
    nz = Math.max(1, Math.min(5, nz));
    if (Math.abs(nz - z) < 0.002) return;
    var cx = (sc.scrollLeft + fx) / z, cy = (sc.scrollTop + fy) / z;
    z = nz;
    pagesEl.style.width = (z * 100) + '%';
    sc.scrollLeft = cx * z - fx;
    sc.scrollTop = cy * z - fy;
  }
  var pin = null, zRaf = 0, zNext = null;
  function applyZoomNow() { zRaf = 0; if (zNext) { var q = zNext; zNext = null; setZoom(q.z, q.x, q.y); } }
  function dist(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy) || 1;
  }
  sc.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) { pin = { d: dist(e.touches), z: z }; }
  }, { passive: true });
  sc.addEventListener('touchmove', function (e) {
    if (pin && e.touches.length === 2) {
      e.preventDefault();
      var r = sc.getBoundingClientRect();
      var fx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
      var fy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      zNext = { z: pin.z * dist(e.touches) / pin.d, x: fx, y: fy };   // one relayout per frame, not per touch event
      if (!zRaf) zRaf = requestAnimationFrame(applyZoomNow);
    }
  }, { passive: false });
  sc.addEventListener('touchend', function (e) {
    if (pin && e.touches.length < 2) { pin = null; applyZoomNow(); schedule(); saveSoon(); }
  }, { passive: true });

  var lastTap = 0, lx = 0, ly = 0, tapT = 0;
  sc.addEventListener('click', function (e) {
    var now = Date.now();
    if (now - lastTap < 320 && Math.abs(e.clientX - lx) < 40 && Math.abs(e.clientY - ly) < 40) {
      if (tapT) { clearTimeout(tapT); tapT = 0; }
      lastTap = 0;
      var r = sc.getBoundingClientRect();
      setZoom(z > 1.2 ? 1 : 2.5, e.clientX - r.left, e.clientY - r.top);
      schedule();
    } else {
      lastTap = now; lx = e.clientX; ly = e.clientY;
      tapT = setTimeout(function () {
        tapT = 0; lastTap = 0;
        if (body.classList.contains('menu')) { closeMenu(); return; }
        if (body.classList.contains('searching')) { try { sinput.blur(); } catch (e) {} return; }
        body.classList.toggle('nobars');   // both bars slide away / back (CSS transition)
      }, 300);
    }
  });
  window.addEventListener('resize', function () { schedule(); });

  /* ---------- search (text layer from the app, Android 15+) ---------- */
  var sres = [], sidx = -1, sq = '', sjob = 0, sdone = true, sunsup = false, sT = 0;
  var sinput = $('sq'), scount = $('scount');
  function openSearch() {
    if (!N) return;
    body.classList.add('searching');
    sinput.focus();
  }
  function closeSearch() {
    sjob++; sdone = true;
    body.classList.remove('searching');
    try { sinput.blur(); } catch (e) {}
    sinput.value = ''; sq = ''; sres = []; sidx = -1; scount.textContent = '';
    clearHl();
  }
  function clearHl() {
    for (var i = 0; i < els.length; i++) {
      var kids = els[i].children;
      for (var k = kids.length - 1; k >= 0; k--) if (kids[k].className && String(kids[k].className).indexOf('hl') === 0) kids[k].remove();
    }
  }
  function paintHl(i) {
    if (!sres.length || !els[i] || !pw[i]) return;
    var kids = els[i].children;
    for (var k = kids.length - 1; k >= 0; k--) if (kids[k].className && String(kids[k].className).indexOf('hl') === 0) kids[k].remove();
    for (var m = 0; m < sres.length; m++) {
      if (sres[m].p !== i) continue;
      for (var r = 0; r < sres[m].r.length; r++) {
        var q = sres[m].r[r], d = document.createElement('div');
        d.className = 'hl' + (m === sidx ? ' cur' : '');
        d.style.left = (q[0] / pw[i] * 100) + '%';
        d.style.top = (q[1] / ph[i] * 100) + '%';
        d.style.width = ((q[2] - q[0]) / pw[i] * 100) + '%';
        d.style.height = ((q[3] - q[1]) / ph[i] * 100) + '%';
        els[i].appendChild(d);
      }
    }
  }
  function updateCount() {
    if (sunsup) { scount.textContent = 'нужен Android 15+'; return; }
    if (!sq) { scount.textContent = ''; return; }
    if (!sres.length) { scount.textContent = sdone ? 'нет' : '…'; return; }
    scount.textContent = (sidx + 1) + '/' + sres.length + (sdone ? '' : '…');
  }
  function parseMatches(str, page) {
    var out = [], ms = str.split('|');
    for (var a = 0; a < ms.length; a++) {
      if (!ms[a]) continue;
      var rs = ms[a].split(';'), rects = [];
      for (var b = 0; b < rs.length; b++) { var v = rs[b].split(',').map(Number); if (v.length === 4 && v[2] > v[0]) rects.push(v); }
      if (rects.length) out.push({ p: page, r: rects });
    }
    return out;
  }
  function startSearch() {
    var q = sinput.value.trim();
    sjob++; sres = []; sidx = -1; sq = q; sunsup = false; sdone = !q;
    clearHl(); updateCount();
    if (q) searchStep(sjob, 0);
  }
  function searchStep(job, i) {
    if (job !== sjob) return;
    var t0 = Date.now();
    while (i < N && Date.now() - t0 < 12) {
      var str = '';
      try { str = String(A.searchPage(i, sq)); } catch (e) { str = '!'; }
      if (str === '!') { sunsup = true; sdone = true; updateCount(); return; }
      var ms = parseMatches(str, i);
      for (var k = 0; k < ms.length; k++) sres.push(ms[k]);
      if (ms.length) {
        if (sidx < 0 && i >= cur) { sidx = sres.length - ms.length; showMatch(); }
        paintHl(i);
      }
      i++;
    }
    if (i < N) { updateCount(); setTimeout(function () { searchStep(job, i); }, 0); return; }
    sdone = true;
    if (sidx < 0 && sres.length) { sidx = 0; showMatch(); }
    updateCount();
  }
  function showMatch() {
    if (sidx < 0 || !sres[sidx]) return;
    var m = sres[sidx], i = m.p;
    paintHl(i);   // repaint so the current match is orange
    var fy = ph[i] ? m.r[0][1] / ph[i] : 0;
    sc.scrollTop = Math.max(0, els[i].offsetTop + fy * els[i].offsetHeight - sc.clientHeight * 0.3);
    updateCount();
  }
  function stepMatch(d) {
    if (!sres.length) return;
    var old = sres[sidx] ? sres[sidx].p : null;
    sidx = (sidx + d + sres.length) % sres.length;
    if (old !== null && old !== sres[sidx].p) paintHl(old);
    showMatch();
  }
  $('snext').addEventListener('click', function () { stepMatch(1); });
  $('sprev').addEventListener('click', function () { stepMatch(-1); });
  $('sclose').addEventListener('click', closeSearch);
  sinput.addEventListener('input', function () { if (sT) clearTimeout(sT); sT = setTimeout(startSearch, 350); });
  sinput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { if (sT) { clearTimeout(sT); sT = 0; } if (sinput.value.trim() !== sq) startSearch(); else stepMatch(1); try { sinput.blur(); } catch (x) {} }
  });

  /* ---------- talking to the app: poll for newly opened documents ---------- */
  function onDoc() {
    var err = 0, count = 0;
    try { err = A.err(); count = A.count(); name = cleanName(A.name()); } catch (e) { err = 1; }
    myDoc++;
    if (err) { showEmpty('Не удалось открыть файл. Возможно, он защищён паролем, повреждён или лежит там, откуда его нельзя прочитать. Скопируй его в «Загрузки» и открой оттуда.', true); return; }
    if (!count) { showEmpty('В этом файле нет страниц.', true); return; }
    N = count;
    titleEl.textContent = name;
    document.body.classList.add('hasdoc');
    document.body.classList.remove('nobars');
    build();
  }
  function poll() {
    var g = gen;
    try { g = A.gen(); } catch (e) {}
    if (g !== gen) { gen = g; onDoc(); }
    setTimeout(poll, 400);
  }
  if (A) { poll(); }
  else { showEmpty('Это окно нужно открыть внутри приложения UltraPDF.', true); }
})();
</script>
</body>
